# Per-agent model routing (PRD §7 Model Routing Strategy, research.md §3)
# Swapping a model is a one-line change here — no code change required
# (resolves PRD Open Question 6).
#
# `providers` holds each provider's connection config; `api_key_env` names the
# env var tools/model_router.py reads the key from (never the key itself —
# same "path, not value" discipline as tools/secrets.py, just sourced from
# the process environment/.env instead of GCP Secret Manager for this
# platform-level model credential).
#
# `fallback` is optional per role. Research calls use Groq when NVIDIA NIM
# times out, is rate-limited, or fails.

providers:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY

# Every NVIDIA `model` value below is the FULL catalog id (including the
# creator-org prefix — nvidia/, minimaxai/, deepseek-ai/, z-ai/) exactly as
# returned by GET /v1/models against https://integrate.api.nvidia.com/v1 —
# that prefix is part of the model id itself, not a stand-in for the
# `provider` field above it. Verified for real against the live API
# (2026-07-09) after every one of these 404'd with a shorter id that dropped
# the org prefix, assuming it was redundant with `provider: nvidia`; it
# isn't — `provider` says which HOST to call, the org prefix says which
# CREATOR's model to run on that host, and NVIDIA hosts models from several
# creators. Re-verify here if a `model_not_found` shows up again — don't
# re-guess the id from the name alone.
orchestrator:
  primary: {provider: nvidia, model: "nvidia/nemotron-3-ultra-550b-a55b"}
  # Groq's real slug is llama-3.3-70b-versatile, not llama-3.3-70b (also
  # verified against GET /v1/models — the shorter name 404'd too).
  fallback: {provider: groq, model: "llama-3.3-70b-versatile"}

planner:
  primary: {provider: nvidia, model: "nvidia/nemotron-3-ultra-550b-a55b"}
  fallback: {provider: groq, model: "llama-3.3-70b-versatile"}

booking:
  primary: {provider: nvidia, model: "deepseek-ai/deepseek-v4-flash"}

memory:
  primary: {provider: nvidia, model: "z-ai/glm-5.2"}

scraper_flights:
  primary: {provider: nvidia, model: "nvidia/nemotron-3-ultra-550b-a55b"}
  fallback: {provider: groq, model: "llama-3.3-70b-versatile"}

scraper_airbnb:
  primary: {provider: nvidia, model: "nvidia/nemotron-3-ultra-550b-a55b"}
  fallback: {provider: groq, model: "llama-3.3-70b-versatile"}
