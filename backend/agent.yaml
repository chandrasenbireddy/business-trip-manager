# Turing deployment block + H2O-O graph (PRD §7, §8.5)
# Filled in incrementally as services are built; placeholder until DevFlow submission.

name: business-travel-manager
version: 0.1.0

services:
  - name: btm-orchestrator
    entrypoint: agents.orchestrator:app
  - name: btm-memory
    entrypoint: agents.memory:app
  - name: btm-scraper-flights
    entrypoint: scrapers.flights:app
  - name: btm-scraper-airbnb
    entrypoint: scrapers.airbnb:app
  - name: btm-api
    entrypoint: api.main:app

# model routing: see tools/model_router.py and models.yaml (research.md §3)
# sdk migration path (PRD §8.5): v1 = strands + manual OTel; v2 = h2o_substrate.sdk decorators

# PDPL/KSA data residency (constitution Principle XII): Cloud SQL, Secret Manager,
# and the OTel collector/Langfuse deployment for the marketplace channel are all
# pinned to the same KSA-region project. No personal data (names, emails, trip
# details) may appear in logs or span attributes — only identifiers (tenant_id,
# user_id, session_id).
region: me-central2  # GCP KSA region
project: humain-494919

# H2O-O graph (PRD §8.5): every node below is a real @traced function
# (tools/telemetry.py) — node names match traced()'s node_name arg exactly,
# so this graph and the OTel node.name span attribute never drift apart.
# Edges are direct calls; a BFF route (api/routes/trips.py confirm) is the
# entry point for the confirm->approve/book branch, not an agent node itself.
graph:
  nodes:
    - orchestrator.handle_trip_request
    - orchestrator.check_calendar_availability
    - memory.get_airbnb_context
    - memory.store_turn
    - memory.retrieve_context
    - memory.get_preferences
    - memory.store_preference
    - memory.summarize_session
    - memory.link_sessions
    - planner.run_research
    - planner.research_category
    - planner.handle_decision
    - planner.build_itinerary
    - booking.notify_approver
    - booking.book_flight
    - booking.book_airbnb
    - booking.add_to_calendar
    - booking.send_email
    - booking.execute_booking
  edges:
    - [orchestrator.handle_trip_request, orchestrator.check_calendar_availability]
    - [orchestrator.handle_trip_request, memory.get_airbnb_context]
    - [orchestrator.handle_trip_request, memory.store_turn]
    - [orchestrator.handle_trip_request, planner.run_research]
    - [planner.run_research, memory.get_preferences]
    - [planner.run_research, memory.retrieve_context]
    - [planner.handle_decision, planner.build_itinerary]  # once every category is resolved
    - [booking.execute_booking, booking.book_flight]
    - [booking.execute_booking, booking.book_airbnb]
    - [booking.execute_booking, booking.add_to_calendar]
    - [booking.execute_booking, booking.send_email]

