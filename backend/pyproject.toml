[project]
name = "btm-backend"
version = "0.1.0"
description = "Business Travel Manager — agents, scrapers, and BFF"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1",
    "browser-use>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "authlib>=1.3",
    "google-cloud-secret-manager>=2.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# 140, not the more common 100/120: several agents/models/*.py SQL literals
# in conn.execute() calls read far worse split across lines than left long.
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["agents*", "scrapers*", "tools*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
