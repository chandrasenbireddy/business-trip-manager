server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BFF routes (contracts/bff-api.md) are mounted at the root, not under an
    # /api prefix — hooks/useTripStream.ts calls /trips/{id}/stream directly.
    # /api is included anyway since it was asked for; it's a no-op today.

    # /trips and /admin/* are genuinely ambiguous: pages/App.tsx's client-side
    # router owns the exact same paths (/trips/:sessionId?, /admin/policy,
    # /admin/audit, /admin/cost-usage) as the backend's REST routes for them.
    # A top-level page load/refresh sends Accept: text/html — serve the SPA
    # shell for those; the frontend's own fetch/EventSource calls don't, so
    # they still reach the backend. /auth/callback must NOT get this
    # treatment — Google's OAuth redirect lands there as a real text/html
    # browser navigation that only the backend can actually handle.
    location ~ ^/(trips|admin) {
        # `break` would only stop rewrite-phase processing and still fall
        # through to proxy_pass below in this same block — `last` restarts
        # location matching on the new URI so /index.html is actually served
        # by the `location /` block instead of being proxied to the backend.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /trips/{id}/stream is Server-Sent Events — a long-lived response
        # nginx must not buffer or time out early, or events never reach the
        # client until the connection closes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Unambiguous: no frontend page route ever shares these paths, so they
    # always proxy straight through.
    location ~ ^/(api|users|auth|waitlist|health) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — any path nginx doesn't otherwise serve falls back to
    # index.html so client-side routing (pages/App.tsx's <Routes>) handles it.
    location / {
        try_files $uri /index.html;
    }
}
